name: Fix Travel Ledger GitHub sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch embedded GitHub sync transport
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<script id="travel-ledger-sync-transport-fix">'
          if marker in text:
              print('Sync transport fix already present; nothing to do.')
              raise SystemExit(0)

          needle = '<meta charset="UTF-8">'
          if needle not in text:
              raise SystemExit('Could not find HTML insertion point.')

          patch = r'''<script id="travel-ledger-sync-transport-fix">
          (() => {
            // The UI stores a GitHub Contents API blob SHA locally. A fresh browser/device
            // can have no cached SHA even though data.json already exists remotely; GitHub
            // then rejects the PUT. This transport layer resolves that race transparently.
            const originalFetch = window.fetch.bind(window);
            let pushQueue = Promise.resolve();

            const isDataFilePut = (input, init) => {
              const method = String((init && init.method) || (input && input.method) || 'GET').toUpperCase();
              if (method !== 'PUT') return false;
              const url = typeof input === 'string' ? input : (input && input.url) || '';
              return /\/contents\/data\.json(?:[?#]|$)/i.test(url) && /api\.github\.com/i.test(url);
            };

            const cloneHeaders = (input, init) => {
              const source = (init && init.headers) || (input && input.headers) || {};
              return new Headers(source);
            };

            const readBody = async (input, init) => {
              if (init && Object.prototype.hasOwnProperty.call(init, 'body')) return init.body;
              if (input && typeof input.clone === 'function') return input.clone().text();
              return undefined;
            };

            const parseJsonBody = async (body) => {
              if (body == null || body === '') return null;
              if (typeof body !== 'string') return null;
              try { return JSON.parse(body); } catch (_) { return null; }
            };

            const buildRequest = (input, init, body) => {
              const next = Object.assign({}, init || {});
              next.method = 'PUT';
              next.body = JSON.stringify(body);
              next.headers = cloneHeaders(input, init);
              return [typeof input === 'string' ? input : input.url, next];
            };

            const getRemoteSha = async (url, headers) => {
              const response = await originalFetch(url, { method: 'GET', headers });
              if (!response.ok) {
                let detail = '';
                try { detail = await response.text(); } catch (_) {}
                throw new Error(`GitHub sync metadata failed (${response.status})${detail ? `: ${detail.slice(0, 180)}` : ''}`);
              }
              const meta = await response.json();
              if (!meta || !meta.sha) throw new Error('GitHub sync metadata did not contain a file SHA.');
              return meta.sha;
            };

            const doPut = async (input, init) => {
              const url = typeof input === 'string' ? input : input.url;
              const originalBody = await readBody(input, init);
              const payload = await parseJsonBody(originalBody);
              if (!payload || typeof payload !== 'object') {
                return originalFetch(input, init);
              }

              const headers = cloneHeaders(input, init);
              headers.set('Accept', 'application/vnd.github+json');

              // Always obtain a current SHA when the caller does not have one.
              if (!payload.sha) {
                payload.sha = await getRemoteSha(url, headers);
              }

              let [requestInput, requestInit] = buildRequest(input, Object.assign({}, init, { headers }), payload);
              let response = await originalFetch(requestInput, requestInit);

              // A cached SHA can become stale if another browser/device pushes first.
              // Refresh once and retry so a normal concurrent edit does not become a hard error.
              if (response.status === 409) {
                const freshSha = await getRemoteSha(url, headers);
                payload.sha = freshSha;
                [requestInput, requestInit] = buildRequest(input, Object.assign({}, init, { headers }), payload);
                response = await originalFetch(requestInput, requestInit);
              }

              return response;
            };

            window.fetch = function(input, init) {
              if (!isDataFilePut(input, init)) return originalFetch(input, init);
              pushQueue = pushQueue.catch(() => {}).then(() => doPut(input, init));
              return pushQueue;
            };
          })();
          </script>
          '''

          path.write_text(text.replace(needle, needle + '\n' + patch, 1), encoding='utf-8')
          print('Embedded GitHub sync transport fix inserted into index.html.')
          PY

      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index.html change required."
            exit 0
          fi
          git commit -m "fix: harden Travel Ledger GitHub sync"
          git push origin main
