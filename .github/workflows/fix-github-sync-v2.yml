name: Fix Travel Ledger GitHub sync v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-github-sync-v2.yml'
      - 'index.html'

permissions:
  contents: write

jobs:
  patch-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Replace GitHub sync implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          text, removed = re.subn(
              r'<script id="travel-ledger-sync-transport-fix">.*?</script>\s*',
              '',
              text,
              count=1,
              flags=re.S,
          )
          if removed:
              print('Removed transport shim.')

          start = text.find('  async function githubPushRemote(retrying){')
          end = text.find('  let githubSyncTimer = null;', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate githubPushRemote block.')

          replacement = r'''  async function githubPushRemote(retrying){
    const s = state.settings;
    const payload = JSON.stringify(syncableData());

    // Always resolve the current remote blob SHA immediately before a push.
    // This avoids relying on localStorage, which may be empty or stale on a new browser.
    const remote = await githubFetchRemote();
    const body = {
      message: `Travel Ledger sync \\u2014 ${new Date().toISOString()}`,
      content: utf8ToBase64(payload),
      branch: s.githubBranch || 'main'
    };
    if (remote.exists && remote.sha) body.sha = remote.sha;

    const res = await fetch(githubApiUrl(), {
      method: 'PUT',
      headers: {
        'Authorization': `token ${s.githubToken}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });

    if (res.status === 409 && !retrying){
      // Another browser/device won the race; refresh the remote SHA and retry once.
      return githubPushRemote(true);
    }
    if (res.status === 401 || res.status === 403) throw new Error('github-auth-failed');
    if (!res.ok){
      const errBody = await res.json().catch(()=>({}));
      throw new Error('github-push-failed:'+res.status+(errBody.message?':'+errBody.message:''));
    }

    const data = await res.json();
    if (!data || !data.content || !data.content.sha) throw new Error('github-push-invalid-response');
    s.githubSha = data.content.sha;
    s.githubLastSyncAt = Date.now();
  }
'''

          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          print('Installed remote-SHA-first GitHub sync implementation.')
          PY

      - name: Commit fix and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-github-sync-v2.yml
          git commit -m "fix: make Travel Ledger GitHub pushes SHA-safe"
          git push origin main
